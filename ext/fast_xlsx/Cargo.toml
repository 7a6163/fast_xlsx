[package]
name = "fast_xlsx"
version = "0.1.0"
edition = "2021"
authors = ["Zac <579103+7a6163@users.noreply.github.com>"]
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
magnus = { version = "0.9", features = ["rb-sys"] }
rb-sys = { version = "0.9", features = ["stable-api-compiled-fallback"] }
# No "zlib" feature: without it zip compresses with zlib-rs, which saves
# 20-30% faster than the system zlib (and needs no C library).
rust_xlsxwriter = { version = "0.99.1", features = ["constant_memory"] }

[build-dependencies]
rb-sys-env = "0.2.2"
