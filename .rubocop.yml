AllCops:
  TargetRubyVersion: 3.3
  NewCops: enable
  SuggestExtensions: false

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

Metrics:
  Exclude:
    - test/**/*
    - examples/**/*

# Worksheet#concat is not Array#concat.
Style/ConcatArrayLiterals:
  Exclude:
    - test/**/*
    - examples/**/*

# Range methods take four coordinates (first_row, first_col, last_row, last_col) plus a value or options.
Metrics/ParameterLists:
  Max: 6

# assert_equal expected, list.map { ... } is unambiguous in practice.
Lint/AmbiguousBlockAssociation:
  Exclude:
    - test/**/*
